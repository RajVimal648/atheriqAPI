<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>New Enquiry — AtherIQ</title>
</head>

<body style="margin:0;padding:0;background:#f5f7fa;font-family:Arial,Helvetica,sans-serif;color:#18263D;">

    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f5f7fa;">
        <tr>
            <td align="center" style="padding:40px 15px;">

                <!-- Main Container -->
                <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0"
                       style="width:100%;max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;">

                    <!-- Header -->
                    <tr>
                        <td align="center" style="padding:30px 40px;background:#ffffff;">
                            <a href="https://atheriq.in" style="text-decoration:none;">
                                <img src="https://red-silence-120.linkyhost.com/?raw=true"
                                     alt="AtherIQ"
                                     width="180"
                                     style="display:block;width:180px;max-width:100%;height:auto;border:0;margin:0 auto;">
                            </a>
                        </td>
                    </tr>

                    <!-- Accent Line -->
                    <tr>
                        <td style="height:4px;background:#1658C7;font-size:0;line-height:0;">
                            &nbsp;
                        </td>
                    </tr>

                    <!-- Heading -->
                    <tr>
                        <td style="padding:40px 40px 14px;">

                            <div style="font-size:24px;line-height:31px;font-weight:700;color:#18263D;">
                                New Website Enquiry
                            </div>

                            <div style="margin-top:7px;font-size:13px;line-height:20px;color:#6b778c;">
                                You have received a new enquiry from
                                <strong style="color:#1658C7;">atheriq.in</strong>
                            </div>

                        </td>
                    </tr>

                    <!-- Enquiry Details -->
                    <tr>
                        <td style="padding:8px 40px 20px;">

                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                                   style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;">

                                <!-- Name -->
                                <tr>
                                    <td style="padding:13px 16px;background:#f8fafc;width:34%;font-size:13px;color:#68758a;">
                                        Name
                                    </td>
                                    <td style="padding:13px 16px;font-size:13px;color:#18263D;font-weight:600;">
                                        {{name}}
                                    </td>
                                </tr>

                                <!-- Email -->
                                <tr>
                                    <td style="padding:13px 16px;background:#f8fafc;font-size:13px;color:#68758a;">
                                        Email
                                    </td>
                                    <td style="padding:13px 16px;font-size:13px;">
                                        <a href="mailto:{{email}}"
                                           style="color:#1658C7;text-decoration:none;">
                                            {{email}}
                                        </a>
                                    </td>
                                </tr>

                                <!-- Phone -->
                                <tr>
                                    <td style="padding:13px 16px;background:#f8fafc;font-size:13px;color:#68758a;">
                                        Phone
                                    </td>
                                    <td style="padding:13px 16px;font-size:13px;">
                                        <a href="tel:{{phone}}"
                                           style="color:#18263D;text-decoration:none;">
                                            {{phone}}
                                        </a>
                                    </td>
                                </tr>

                                <!-- Company -->
                                <tr>
                                    <td style="padding:13px 16px;background:#f8fafc;font-size:13px;color:#68758a;">
                                        Company
                                    </td>
                                    <td style="padding:13px 16px;font-size:13px;color:#18263D;font-weight:600;">
                                        {{company}}
                                    </td>
                                </tr>

                                <!-- Service -->
                                <tr>
                                    <td style="padding:13px 16px;background:#f8fafc;font-size:13px;color:#68758a;">
                                        Service
                                    </td>
                                    <td style="padding:13px 16px;font-size:13px;color:#18263D;font-weight:600;">
                                        {{service}}
                                    </td>
                                </tr>

                                <!-- Time -->
                                <tr>
                                    <td style="padding:13px 16px;background:#f8fafc;font-size:13px;color:#68758a;">
                                        Time
                                    </td>
                                    <td style="padding:13px 16px;font-size:13px;color:#18263D;">
                                        {{time}}
                                    </td>
                                </tr>

                            </table>

                        </td>
                    </tr>

                    <!-- Message -->
                    <tr>
                        <td style="padding:0 40px 30px;">

                            <div style="font-size:16px;font-weight:700;color:#18263D;margin-bottom:10px;">
                                Message
                            </div>

                            <div style="padding:18px 20px;background:#fafafa;border-left:4px solid #1658C7;border-radius:8px;
                                        font-size:14px;line-height:23px;color:#53627a;">
                                {{message}}
                            </div>

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background:#18263D;padding:20px 32px;text-align:center;">

                            <div style="font-size:12px;line-height:20px;color:#aebbd0;">
                                This enquiry was submitted through
                                <strong style="color:#ffffff;">atheriq.in</strong>.
                            </div>

                            <div style="margin-top:6px;font-size:11px;line-height:18px;color:#7f8da3;">
                                © AtherIQ. All rights reserved.
                            </div>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
